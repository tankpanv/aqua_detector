{% extends "base.html" %}
{% set title = "修改密码" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fas fa-key me-2"></i>修改密码
                </h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="old_password" class="form-label">当前密码</label>
                        <input type="password" class="form-control" id="old_password" name="old_password" 
                               placeholder="请输入当前密码" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">新密码</label>
                        <input type="password" class="form-control" id="password" name="password" 
                               placeholder="请输入新密码" required>
                    </div>

                    <div class="mb-3">
                        <label for="password2" class="form-label">确认新密码</label>
                        <input type="password" class="form-control" id="password2" name="password2" 
                               placeholder="请再次输入新密码" required>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-warning">修改密码</button>
                        <a href="{{ url_for('profile') }}" class="btn btn-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="alert alert-info mt-3">
            <i class="fas fa-info-circle me-2"></i>
            <strong>安全提示：</strong>
            <ul class="mb-0 mt-2">
                <li>新密码长度至少6位字符</li>
                <li>建议使用字母、数字和特殊字符的组合</li>
                <li>不要使用与用户名相同的密码</li>
            </ul>
        </div>
    </div>
</div>
{% endblock %}
