{% extends "base.html" %}
{% set title = "编辑资料" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">
                    <i class="fas fa-edit me-2"></i>编辑个人资料
                </h5>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="real_name" class="form-label">真实姓名</label>
                            <input type="text" class="form-control" id="real_name" name="real_name" 
                                   placeholder="请输入真实姓名" value="{{ user.real_name or '' }}">
                        </div>
                        
                        <div class="col-md-6 mb-3">
                            <label for="phone" class="form-label">手机号</label>
                            <input type="text" class="form-control" id="phone" name="phone" 
                                   placeholder="请输入手机号" value="{{ user.phone or '' }}">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="organization" class="form-label">所属机构</label>
                        <input type="text" class="form-control" id="organization" name="organization" 
                               placeholder="请输入所属机构" value="{{ user.organization or '' }}">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">更新资料</button>
                        <a href="{{ url_for('profile') }}" class="btn btn-secondary">取消</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
